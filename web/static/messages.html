<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Bot — Сообщения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e5e5e5;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header {
            padding: 16px 20px;
            background: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .nav-link {
            color: #4a76a8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: #e9f0fe;
        }

        .search-box {
            padding: 12px 20px;
            background: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background: white;
            margin-bottom: 8px;
        }

        .search-input:focus {
            border-color: #4a76a8;
        }

        .filter-tabs {
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .filter-tab {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .filter-tab:hover {
            background: #f5f5f5;
        }

        .filter-tab.active {
            background: #4a76a8;
            color: white;
            border-color: #4a76a8;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message-group {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .message-group:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-color: #4a76a8;
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4a76a8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .message-info {
            flex: 1;
        }

        .message-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .message-text {
            color: #333;
            line-height: 1.4;
            margin-top: 8px;
        }

        .unread-badge {
            background: #25d366;
            color: white;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>Сообщения</h1>
        <a href="/admin" class="nav-link">← К чатам</a>
    </div>

    <div class="search-box">
        <input type="text" id="contact-search" class="search-input" placeholder="Поиск по имени, телефону, EMC...">
        <input type="text" id="message-search" class="search-input" placeholder="Поиск по содержимому сообщений...">
    </div>

    <div class="filter-tabs">
        <div class="filter-tab active" data-filter="all">Все</div>
        <div class="filter-tab" data-filter="unread">Непрочитанные</div>
        <div class="filter-tab" data-filter="sent">Отправленные</div>
    </div>

    <div id="messages-container" class="messages-container">
        <div class="empty-state">Загрузка сообщений...</div>
    </div>
</div>

<script>
    let allMessages = [];
    let unreadMessages = []; // Непрочитанные сообщения из БД бота
    let contacts = new Map();
    let currentFilter = 'all';
    let contactSearchQuery = '';
    let messageSearchQuery = '';

    // Форматирование времени
    function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        return date.toLocaleString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Загрузка контактов
    async function loadContacts() {
        try {
            const resp = await fetch('/contacts');
            const data = await resp.json();
            if (data.status === 'ok') {
                data.contacts.forEach(contact => {
                    contacts.set(contact.ChatID, contact);
                });
            }
        } catch (err) {
            console.error('loadContacts error:', err);
        }
    }

    // Загрузка всех сообщений
    async function loadAllMessages() {
        try {
            allMessages = [];

            for (const [chatId, contact] of contacts) {
                const resp = await fetch(`/get-messages-by-chatid?chat_id=${chatId}`);
                if (!resp.ok) continue;

                const messages = await resp.json();
                messages.forEach(msg => {
                    allMessages.push({
                        ...msg,
                        chatId: chatId,
                        contact: contact
                    });
                });
            }

            // Сортируем по времени (новые сначала)
            allMessages.sort((a, b) => b.timestamp - a.timestamp);

            renderMessages();
        } catch (err) {
            console.error('loadAllMessages error:', err);
        }
    }

    // Загрузка непрочитанных сообщений из БД бота
    async function loadUnreadMessages() {
        try {
            const resp = await fetch('/unread-messages');
            if (!resp.ok) {
                console.error('loadUnreadMessages: failed to fetch');
                return;
            }

            const data = await resp.json();
            if (data.status !== 'ok') {
                console.error('loadUnreadMessages: bad status', data);
                return;
            }

            unreadMessages = [];

            if (Symbol.iterator in Object(data.messages)) {
            // Ищем непрочитанные сообщения в уже загруженном массиве allMessages
            for (const unread of data.messages) {
                const msg = allMessages.find(m =>
                    m.chatId === unread.chat_id && m.body.mid === unread.message_mid
                );

                if (msg) {
                    unreadMessages.push(msg);
                }
            }

            // Сортируем по времени (новые сначала)
            unreadMessages.sort((a, b) => b.timestamp - a.timestamp);
            }

            renderMessages();
        } catch (err) {
            console.error('loadUnreadMessages error:', err);
        }
    }

    // Фильтрация и рендер сообщений
    function renderMessages() {
        const container = document.getElementById('messages-container');



        let filtered;

        // Для непрочитанных используем отдельный массив из БД
        if (currentFilter === 'unread') {

            filtered = unreadMessages;
        } else {
            // Для остальных фильтров используем allMessages
            filtered = allMessages.filter(msg => {
                if (currentFilter === 'sent') {
                    // Отправленные сообщения (от бота)
                    return msg.sender && msg.sender.is_bot;
                }
                return true; // 'all'
            });
        }

        // Фильтр по контакту
        if (contactSearchQuery) {
            const query = contactSearchQuery.toLowerCase();
            filtered = filtered.filter(msg => {
                const contact = msg.contact;
                const name = (contact.Name || '').toLowerCase();
                const phone = (contact.Phone || '').toLowerCase();
                const emc = (contact.EMC || '').toLowerCase();
                return name.includes(query) || phone.includes(query) || emc.includes(query);
            });
        }

        // Фильтр по содержимому
        if (messageSearchQuery) {
            const query = messageSearchQuery.toLowerCase();
            filtered = filtered.filter(msg =>
                (msg.body.text || '').toLowerCase().includes(query)
            );
        }

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">Сообщений не найдено</div>';
            return;
        }

        container.innerHTML = '';
        filtered.forEach(msg => {
            const contact = msg.contact;
            const name = contact.Name || contact.Phone || `User ${contact.UserID}`;
            const emc = contact.EMC || '';
            const avatarText = emc || (contact.Phone ? contact.Phone.slice(-2) : contact.UserID.toString().slice(-2)).toUpperCase();
            const avatarUrl = contact.AvatarURL || '';

            const div = document.createElement('div');
            div.className = 'message-group';
            div.setAttribute('data-mid', msg.body.mid || '');
            div.onclick = () => openChat(msg.chatId, msg.body.mid);

            const avatarHtml = avatarUrl
                ? `<img src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(name)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">`
                : `<div class="avatar">${avatarText}</div>`;

            div.innerHTML = `
                <div class="message-header">
                    ${avatarHtml}
                    <div class="message-info">
                        <div class="message-name">${escapeHtml(name)}</div>
                        <div class="message-time">${formatTime(msg.timestamp)}</div>
                    </div>
                </div>
                <div class="message-text">${escapeHtml(msg.body.text || '')}</div>
            `;

            container.appendChild(div);
        });
    }

    // Открыть чат на странице index.html
    function openChat(chatId, mid) {
        const url = mid ? `/admin?chat_id=${chatId}&message_mid=${mid}` : `/admin?chat_id=${chatId}`;
        window.location.href = url;
    }

    // Обработчики фильтров
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', async () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.getAttribute('data-filter');

            // Если переключились на "непрочитанные", загружаем их из БД
            if (currentFilter === 'unread') {
                await loadUnreadMessages();
            } else {
                renderMessages();
            }
        });
    });

    // Обработчики поиска
    document.getElementById('contact-search').addEventListener('input', (e) => {
        contactSearchQuery = e.target.value;
        renderMessages();
    });

    document.getElementById('message-search').addEventListener('input', (e) => {
        messageSearchQuery = e.target.value;
        renderMessages();
    });

    // Инициализация
    loadContacts().then(() => {
        loadAllMessages();
    });
</script>
</body>
</html>
