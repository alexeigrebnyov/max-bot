services:
  max-bot-service:
    image: max-bot-service:local
    container_name: max-bot-service
    restart: always
    env_file:
      - .env 
    environment:
      - BOT_TOKEN=${BOT_TOKEN:?}          # токен бота MAX
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?}# секрет для проверки webhook
      - WEBHOOK_URL=${WEBHOOK_URL:?}      # публичный URL https://.../webhook (для регистрации)
    volumes:
      - ./data:/data                      # SQLite-хранилище контактов
    ports:
      - "8080:8080"                       # HTTP API и /webhook
