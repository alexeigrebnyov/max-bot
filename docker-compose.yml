services:
  max-bot-service:
    build: .
    image: max-bot-service:local
    container_name: max-bot-service
    restart: always
    env_file:
      - .env 
    environment:
      - BOT_TOKEN=${BOT_TOKEN:?}           # токен бота MAX
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-} # для Webhook; при Long Polling не нужен
      - WEBHOOK_URL=${WEBHOOK_URL:-}       # при пустом — Long Polling
      - MAX_API_BASE_URL=${MAX_API_BASE_URL:-}
      - API_BASE_URL=${API_BASE_URL:-}
    volumes:
      - ./data:/data                      # SQLite-хранилище контактов
    ports:
      - "8080:8080"                       # HTTP API и /webhook
